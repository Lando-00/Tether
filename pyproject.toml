[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tether"
version = "0.1.0"
description = "Local LLM inference with function calling, session-based streaming"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Lando-00"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "requests",
    "aiosqlite>=0.19,<1",
    "yoyo-migrations>=8.2,<9",
    "platformdirs>=4.0,<5",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]"]
cli = ["typer", "rich", "prompt-toolkit"]
brave = []     # httpx is in core; reserved for future Brave-specific dependencies.
ollama = []    # Reserved for future provider support; no implementation in this refactor.
mlc = []       # Qualcomm CodeLinaro Adreno wheels are installed separately; see environment.yml.
nexa = []      # Reserved for future Snapdragon NPU provider support.
sqlcipher = [] # Reserved for optional encrypted SQLite support.
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
dev = ["pytest>=7", "pytest-asyncio", "ruff", "mypy", "build"]

[project.scripts]
tether-server = "tether.app._entry:main"
tether-cli = "tether.cli._entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tether", "src/tether_service"]

# Force-include the DLL-search-path fix as a top-level .pth file so it lands
# directly in site-packages/. The .pth file pre-imports `ssl` during Python's
# site initialization, before tvm (transitively imported by mlc_llm) can
# corrupt the DLL search path by feeding stale base-conda %PATH% entries to
# os.add_dll_directory(). See docs/runbooks/fresh-env-setup.md
# Troubleshooting → "import mlc_llm fails with ImportError: DLL load failed
# while importing _ssl" and fu-fresh-env-mlc-llm-import for the full diagnosis.
[tool.hatch.build.targets.wheel.force-include]
"src/_tether_dll_fix.pth" = "_tether_dll_fix.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast pure-Python unit tests, default-on",
    "integration: cross-module tests; may touch sqlite/aiosqlite/in-process FastAPI",
    "network: tests that hit a real external network (Brave/etc.); default-off",
    "hardware: tests that require the Snapdragon Adreno GPU; default-off",
    "e2e: end-to-end tests requiring a running server; default-off",
    "docs: spec generation drift checks; default-off",
    "asyncio: pytest-asyncio marker (kept for compatibility)",
]
addopts = "--strict-markers --strict-config -m \"not network and not hardware and not e2e and not docs\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # yoyo-migrations 8.x uses datetime.utcnow() internally; suppress until
    # yoyo releases a fix. This does NOT suppress our own DeprecationWarnings.
    "ignore::DeprecationWarning:yoyo",
    # yoyo imports pkg_resources which emits a UserWarning attributed to
    # yoyo.migrations (stacklevel=2 in pkg_resources.__init__).
    # Suppress so -W error sweeps stay clean.
    "ignore::UserWarning:yoyo",
]
