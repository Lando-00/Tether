name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,cli,brave,dev]"
      - name: ruff
        run: ruff check src/tether tests
      - name: mypy
        run: mypy src/tether
      - name: pytest (default suite)
        run: python -m pytest -q
      - name: pytest (docs drift gate)
        run: python -m pytest -q -m docs tests/docs
      - name: build sdist+wheel
        run: |
          python -m pip install build
          python -m build
