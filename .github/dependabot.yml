version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # requirements.txt is a fully-resolved lockfile, so an ungrouped run
    # opens one PR per transitive package — and because they all edit that
    # single file, every PR after the first lands in conflict. Group them
    # into one so the batch applies cleanly.
    groups:
      python-dependencies:
        patterns:
          - "*"
    # These are pinned to the mlc-venv2 baseline on purpose (see the comment
    # block in pyproject.toml and refactor/fu-pin-fastapi-pydantic-versions).
    # MLC/TVM Adreno wheels are installed out-of-band against that exact
    # environment, so a major/minor bump here silently desynchronises the
    # lockfile from the interpreter the service actually runs on. Patch
    # releases still come through, which is what the pin ranges allow.
    # Re-baselining is a deliberate task, not a dependency-bot decision.
    ignore:
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "uvicorn"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "pydantic-settings"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "yoyo-migrations"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # starlette is constrained transitively by the pinned FastAPI
      # (fastapi 0.117.x requires starlette<0.49). Dependabot proposed 1.3.1,
      # which cannot be installed alongside it.
      - dependency-name: "starlette"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # setuptools is a compatibility CEILING, not a stale pin. yoyo 8.x does
      # `import pkg_resources` at module scope and setuptools removed that
      # module in 81, so raising the bound breaks every migration-backed test
      # with ModuleNotFoundError. Dependabot proposed <84 and turned CI red.
      # Ignore outright — the bound moves only when yoyo reaches 9.x.
      - dependency-name: "setuptools"
      # neonize is pinned EXACTLY on purpose (ADR-0018 D1): .post0 releases are
      # DLL-only, but minor-version moves may break the adapter's BLOCKER
      # workarounds. tests/unit/connectors/whatsapp/test_pip_extra_resolves.py
      # guards the exact pin, so a bump fails CI by design.
      - dependency-name: "neonize"
      # phonenumbers is held at <9 to stay aligned with the pinned neonize.
      - dependency-name: "phonenumbers"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
